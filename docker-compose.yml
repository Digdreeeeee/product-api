services:
  mongodb:
    image: mongo:7
    container_name: nammongodb-compose
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: product-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb

volumes:
  mongo_data:
