services:
  
  watchtower:

    image: nickfedor/watchtower
    container_name: product-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
  mongodb:
    image: mongo:7
    container_name: product-mongodb-prod
    restart: unless-stopped
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    image: anhkhoa203/product-api:latest
    container_name: product-api-prod
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_prod_data:
