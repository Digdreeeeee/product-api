name: Product CI (Production-like)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start stack and wait for healthy
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          docker compose ps

      - name: Run CRUD tests against MongoDB
        env:
          MONGO_URI: mongodb://localhost:27017/productdb_test
        run: npm test

      - name: Smoke test running container
        run: |
          curl -fsS http://localhost:3000/health
          curl -fsS -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":99,"pname":"CI","price":1,"quantity":1}'
          curl -fsS http://localhost:3000/products/99

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v