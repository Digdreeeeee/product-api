name: CD - Docker Hub

on:
  workflow_run:
    workflows: ["Product CI (Production-like)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  push-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }} .

      - name: Verify image is healthy before push
        run: |
          docker network create ci-net
          docker run -d --name mongo --network ci-net mongo:7
          docker run -d --name api --network ci-net -p 3000:3000 \
            -e PORT=3000 -e MONGO_URI=mongodb://mongo:27017/productdb \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health | grep '"db":1' && exit 0
            sleep 3
          done
          docker logs api
          exit 1

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
